schemaVersion: 1

abilities:
  upgrade_aura_hybrid_fire_storm_rune_i:
    name: "<gray>Aura hybrid_fire_storm_rune_i</gray>"
    description: "<dark_gray>Effetto visivo elementale.</dark_gray>"
    costs:
      - type: mana
        amount: 6
    cooldown:
      ticks: 80
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          for_each_target type=nearest radius=6 filter=mobs maxTargets=2 sort=nearest originAt=origin {
            lightning effectOnly=false
            particles.ring particle=DUST radius=0.6 points=12 count=1 offset=0.04 color="#fff2a8" size=0.8
            particles.point particle=ELECTRIC_SPARK count=2 offset=0.08
          }
          particles.ring particle=DUST radius=1.5 points=26 count=1 offset=0.04 color="#ff6a00" size=1.0
          particles.ring particle=DUST radius=1.1 points=18 count=1 offset=0.04 color="#66b3ff" size=0.9
          particles.point particle=FLAME count=1 offset=0.05
          particles.point particle=ELECTRIC_SPARK count=1 offset=0.05
        }
