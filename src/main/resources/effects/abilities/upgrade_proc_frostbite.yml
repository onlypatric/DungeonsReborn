schemaVersion: 1

abilities:
  upgrade_proc_frostbite:
    name: "<aqua>Proc: Morso Gelido</aqua>"
    description: "<dark_gray>Rallenta e infligge danni nel tempo.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.point particle=SNOWFLAKE count=8 offset=0.1
          for_each_target type=nearest radius=3 filter=mobs originAt=origin {
            potion effect=SLOWNESS durationTicks=80 amplifier=0
            damage_over_time amount=1 periodTicks=20 times=2
          }
        }
