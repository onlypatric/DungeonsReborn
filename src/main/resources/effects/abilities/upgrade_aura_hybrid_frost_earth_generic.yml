schemaVersion: 1

abilities:
  upgrade_aura_hybrid_frost_earth_generic:
    name: "<gray>Aura Ibrida</gray>"
    description: "<dark_gray>Aura ibrida elementale.</dark_gray>"
    costs:
      - type: mana
        amount: 6
    cooldown:
      ticks: 80
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=DUST radius=1.4 points=24 count=1 offset=0.04 color="#7fd6ff" size=1.0
          particles.ring particle=DUST radius=1.1 points=18 count=1 offset=0.04 color="#8b5a2b" size=0.9
          particles.point particle=END_ROD count=1 offset=0.03
          for_each_target type=sphere radius=3 filter=mobs originAt=origin {
            potion effect=SLOWNESS durationTicks=40 amplifier=0
          }
        }
