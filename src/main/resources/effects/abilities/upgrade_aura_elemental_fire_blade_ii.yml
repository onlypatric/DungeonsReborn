schemaVersion: 1

abilities:
  upgrade_aura_elemental_fire_blade_ii:
    name: "<red>Aura Lama Fuoco II</red>"
    description: "<dark_gray>Brucia i nemici vicini.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=DUST radius=1.4 points=24 count=1 offset=0.04 color="#ff5a1f" size=1.1
          particles.point particle=FLAME count=2 offset=0.08
          for_each_target type=sphere radius=3 filter=mobs originAt=origin {
            ignite durationTicks=40
          }
        }
