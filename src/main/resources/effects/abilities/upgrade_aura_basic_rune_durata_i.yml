schemaVersion: 1

abilities:
  upgrade_aura_basic_rune_durata_i:
    name: "<gray>Aura Durata I</gray>"
    description: "<dark_gray>Segnale visivo di durata.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=DUST radius=1.25 points=20 count=1 offset=0.03 color="#c0c0c0" size=0.9
          particles.point particle=END_ROD count=1 offset=0.02
        }
