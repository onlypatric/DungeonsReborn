schemaVersion: 1

abilities:
  upgrade_aura_elemental_resist_arcane_i:
    name: "<light_purple>Aura Resistenza Arcana</light_purple>"
    description: "<dark_gray>Resistenza periodica.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=DUST radius=1.2 points=22 count=1 offset=0.04 color="#b68cff" size=1.0
          for_each_target type=self filter=players originAt=origin {
            potion effect=RESISTANCE durationTicks=40 amplifier=0
          }
        }
