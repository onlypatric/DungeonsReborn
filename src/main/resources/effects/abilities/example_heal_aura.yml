schemaVersion: 1
abilities:
  example_heal_aura:
    name: <green>Sanctum Pulse</green>
    description: <gray>Healing aura with soft VFX.</gray>
    action:
      type: pulse
      durationTicks: 200
      periodTicks: 20
      easing: IN_OUT_CUBIC
      followCaster: true
      action:
        type: sequence
        actions:
          -
            type: particles_ring
            particle: HAPPY_VILLAGER
            radius: 2.0
            points: 24
            count: 1
            offset: 0.12
            extra: 0.0
          -
            type: for_each_target
            targeter:
              type: sphere
              radius: 6.0
              ignoreCaster: true
              filter: players
            then:
              type: heal_over_time
              amount: 1.2
              periodTicks: 20
              times: 1
              policy: any
              healType: HOT
              cap: 0.0
              overhealToShield: false
              shieldCap: 0.0
              shieldDecayTicks: 0
            mode: each
            originAt: origin
