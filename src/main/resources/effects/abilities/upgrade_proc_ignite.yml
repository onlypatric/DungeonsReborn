schemaVersion: 1

abilities:
  upgrade_proc_ignite:
    name: "<red>Proc: Incendio</red>"
    description: "<dark_gray>Brucia il bersaglio per breve tempo.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.point particle=FLAME count=4 offset=0.08
          for_each_target type=nearest radius=3 filter=mobs originAt=origin {
            ignite durationTicks=60
          }
        }
