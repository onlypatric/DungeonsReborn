schemaVersion: 1

abilities:
  upgrade_proc_knockback:
    name: "<gold>Proc: Contraccolpo</gold>"
    description: "<dark_gray>Piccolo knockback con danno lieve.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=CRIT radius=1.2 points=18 count=1 offset=0.05
          for_each_target type=nearest radius=2.5 filter=mobs originAt=origin {
            knockback horizontal=0.4 vertical=0.08
            damage amount=1
          }
        }
