schemaVersion: 1
abilities:
  example_damage_burst:
    name: <gold>Crackling Burst</gold>
    description: <gray>AOE shockwave + knockback.</gray>
    action:
      type: sequence
      actions:
        -
          type: sound
          sound: "minecraft:entity.lightning_bolt.thunder"
          volume: 0.7
          pitch: 1.6
        -
          type: particles_ring
          particle: ELECTRIC_SPARK
          radius: 2.4
          points: 36
          count: 1
          offset: 0.1
          extra: 0.0
        -
          type: for_each_target
          targeter:
            type: sphere
            radius: 5.5
            ignoreCaster: true
            filter: mobs
          then:
            type: sequence
            actions:
              -
                type: damage_typed
                amount: 6.5
                damageType: LIGHTNING
                damageCause: AOE
                ignoreResistance: false
                policy: hostile_default
                mode: FLAT
              -
                type: knockback
                horizontal: 0.65
                vertical: 0.3
          mode: each
          originAt: origin
