schemaVersion: 1

abilities:
  upgrade_aura_basic_armor_vita_i:
    name: "<pink>Aura Vita I</pink>"
    description: "<dark_gray>Rigenerazione leggera.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=DUST radius=1.2 points=22 count=1 offset=0.04 color="#ff66aa" size=1.0
          for_each_target type=self filter=players originAt=origin {
            potion effect=REGENERATION durationTicks=40 amplifier=0
          }
        }
