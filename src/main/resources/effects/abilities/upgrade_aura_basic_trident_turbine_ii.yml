schemaVersion: 1

abilities:
  upgrade_aura_basic_trident_turbine_ii:
    name: "<aqua>Aura Turbine II</aqua>"
    description: "<dark_gray>Rallenta i nemici vicini.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=DUST radius=1.4 points=24 count=1 offset=0.04 color="#6ec6ff" size=1.05
          for_each_target type=sphere radius=3 filter=mobs originAt=origin {
            potion effect=SLOWNESS durationTicks=40 amplifier=0
          }
        }
