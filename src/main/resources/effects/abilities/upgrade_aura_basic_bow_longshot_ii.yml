schemaVersion: 1

abilities:
  upgrade_aura_basic_bow_longshot_ii:
    name: "<gray>Aura Longshot II</gray>"
    description: "<dark_gray>Indebolisce i nemici vicini.</dark_gray>"
    script:
      language: "dsl-v1"
      source: |-
        on_cast {
          particles.ring particle=DUST radius=1.4 points=24 count=1 offset=0.04 color="#b4c7d6" size=1.05
          for_each_target type=sphere radius=3 filter=mobs originAt=origin {
            potion effect=WEAKNESS durationTicks=60 amplifier=0
          }
        }
