# DungeonsReborn shops.yml
#
# Shops are virtual villager GUIs. No real entity is spawned.
# Trades accept items, tokens, or a mix of both.
#
# Token:
# - This is the currency item for token-based trades.
# - It is marked with a PDC key so it cannot be spoofed by a normal item.
#
schemaVersion: 1

token:
  markerKey: dungeonsreborn:shop_token
  material: SUNFLOWER
  name: "<gold><bold>Gettone</bold></gold>"
  lore:
    - "<gray>Valuta ufficiale di scambio</gray>"
    - "<dark_gray>Usata nei negozi di DungeonsReborn</dark_gray>"

# Optional compacted token tiers for large trades.
tokenTiers:
  compressed:
    markerKey: dungeonsreborn:shop_token_compressed
    material: SUNFLOWER
    name: "<yellow><bold>Gettone Compresso</bold></yellow>"
    lore:
      - "<gray>Valore: <white>64</white> Gettoni</gray>"
      - "<dark_gray>Valuta per scambi in quantita</dark_gray>"
  pallet:
    markerKey: dungeonsreborn:shop_token_pallet
    material: SUNFLOWER
    name: "<gold><bold>Pallet di Gettoni</bold></gold>"
    lore:
      - "<gray>Valore: <white>64</white> Gettoni Compressi</gray>"
      - "<dark_gray>Valuta di alto valore</dark_gray>"

# Optional item value model (used by vendors/auto-pricing systems).
# Values are per-item, in tokens.
values:
  - type: material
    material: DIAMOND
    value: 4
  - type: itemId
    itemId: mythic-sword
    value: 200
