        type: <gray>Type:</gray> <white>{value}</white>
        cost: <gray>Cost:</gray> <white>{value}</white>
        requires: <gray>Requires:</gray> <white>{value}</white>
        status:
          unlocked: <green>Unlocked</green>
          locked: <red>Locked</red>
      respec:
        title: <gold><bold>Respec Skill</bold></gold>
        cost: <gray>Respec cost:</gray> <white>{tokens} tokens, {points} points</white>
