        points:
          unspent: <gray>Unspent points:</gray> <white>{value}</white>
          total: <gray>Points total:</gray> <white>{value} (spent {spent})</white>
        unlocked: <gray>Unlocked nodes:</gray> <white>{unlocked}/{total}</white>
        respecCost: <gray>Respec cost:</gray> <white>{tokens} tokens, {points} points</white>
        hint:
          unlock: <gray>Left-click to unlock.</gray>
          respec: <gray>Right-click to respec.</gray>
