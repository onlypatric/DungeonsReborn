    items: 'Items: {count}'
    truncated: List truncated. Refine search.
    filter: 'Filter: {query}'
  common:
    line:
      id: <gray>ID:</gray> <white>{value}</white>
      status: <gray>Status:</gray> {value}
      permission: <gray>Permission:</gray> <white>{value}</white>
      detail: <gray>Detail:</gray> <white>{value}</white>
      source: <gray>Source:</gray> <white>{value}</white>
      lastReload: <gray>Last reload:</gray> <white>{value}</white>
      subsystem: <gray>Subsystem:</gray> <white>{value}</white>
    status:
      enabled: <green>Enabled</green>
      disabled: <red>Disabled</red>
    errors:
      none: <green>No errors.</green>
      clickView: <red>Click to view errors.</red>
      count: <red>Errors:</red> <white>{count}</white>
    action:
      leftClickEdit: <green>Left click to edit.</green>
      rightClickDelete: <red>Right click to delete.</red>
    none: <gray>(none)</gray>
    unknown: <gray>(unknown)</gray>
  classes:
