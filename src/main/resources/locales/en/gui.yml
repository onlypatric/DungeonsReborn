      level: <gray>Level:</gray> <white>{current}/{required}</white>
      tokens: <gray>Tokens:</gray> <white>{current}/{required}</white>
      quests: <red>Requires quests:</red> <white>{quests}</white>
      world: <red>Unavailable in this world.</red>
    select:
      title: <white><bold>Choose Class</bold></white>
      header:
        title: <gold><bold>Classes</bold></gold>
        hint1: <gray>Select a class to unlock.</gray>
        hint2: <gray>Only one class can be active.</gray>
      refresh:
        title: <yellow><bold>Refresh</bold></yellow>
        hint: <gray>Reload the list.</gray>
      entry:
        selected: <green>Selected</green>
      confirm:
        title: <gold><bold>Confirm Class</bold></gold>
      stat:
        strength: <gray>Strength:</gray> <white>+{value}</white>
        dexterity: <gray>Dexterity:</gray> <white>+{value}</white>
        intelligence: <gray>Intelligence:</gray> <white>+{value}</white>
        vitality: <gray>Vitality:</gray> <white>+{value}</white>
        manaMax: <gray>Mana Max:</gray> <white>+{value}</white>
        manaRegen: <gray>Mana Regen:</gray> <white>+{value}</white>
