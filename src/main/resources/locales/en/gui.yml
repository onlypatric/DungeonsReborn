          title: <dark_gray><bold>Preview Changes</bold></dark_gray>
          hint: <gray>Place a target item and upgrade.</gray>
        missing:
          title: <red><bold>Upgrade System Missing</bold></red>
          hint: <gray>Try again later.</gray>
        error:
          title: <red><bold>No Changes</bold></red>
        none:
          hint: <gray>No changes detected.</gray>
      section:
        modifiers: <gold><bold>Modifiers</bold></gold>
        enchants: <gold><bold>Enchantments</bold></gold>
        attributes: <gold><bold>Attributes</bold></gold>
        status: <gold><bold>Status Effects</bold></gold>
        bindings: <gold><bold>Spell Binds</bold></gold>
        secondary: <gold><bold>Secondary Abilities</bold></gold>
      error:
        line: <red>{error}</red>
      cost:
        title: <gold>Cost</gold>
        pallet: <gray>- {amount} pallet</gray>
        compressed: <gray>- {amount} compressed</gray>
        tokens: <gray>- {amount} tokens</gray>
      requirements:
        title: <gold>Requirements</gold>
        minXp: '<gray>- Requires: {value} XP levels</gray>'
        consumeXp: '<gray>- Consumes: {value} XP levels</gray>'
        minTotalXp: '<gray>- Requires: {value} total XP</gray>'
        consumeTotalXp: '<gray>- Consumes: {value} total XP</gray>'
        minProgress: '<gray>- Requires: {value} XP progress</gray>'
        consumeProgress: '<gray>- Consumes: {value} XP progress</gray>'
        minMaxMana: '<gray>- Requires: {value} max mana</gray>'
      tip:
        bindingSlot: '<dark_gray>Tip: remove the existing bind for that slot.</dark_gray>'
        enchantConflict: '<dark_gray>Tip: remove conflicting enchants or allow unsafe.</dark_gray>'
        compatibility: '<dark_gray>Tip: check upgrade compatibility filters.</dark_gray>'
        manaProvider: '<dark_gray>Tip: enable the mana provider.</dark_gray>'
        maxMana: '<dark_gray>Tip: increase max mana before applying.</dark_gray>'
        xp: '<dark_gray>Tip: earn more XP before applying.</dark_gray>'
        tokens: '<dark_gray>Tip: earn tokens before applying.</dark_gray>'
      slot:
        contains: <dark_gray>Slot contains:</dark_gray>
        line: <gray>- {value}</gray>
        more: <gray>- ...</gray>
        occupied: <dark_gray>Slot is occupied by an item binding.</dark_gray>
      warning:
        binding: '<yellow>Warning: existing {binding} binding.</yellow>'
        overwrite: <dark_gray>This upgrade will replace the previous upgrade for that slot.</dark_gray>
      activator:
        left: Left Click
        right: Right Click
        shiftLeft: Shift+Left
        shiftRight: Shift+Right
        passive: Passive
      conflicts:
        title: <dark_gray>Conflicts:</dark_gray>
        line: <gray>- {value}</gray>
        more: <gray>- ...</gray>
      apply:
        title: <green><bold>Apply Upgrade</bold></green>
        waiting:
          title: <dark_gray><bold>Apply Upgrade</bold></dark_gray>
          hint: <gray>Place a target item and upgrade.</gray>
        missing:
          title: <red><bold>Upgrade System Missing</bold></red>
          hint: <gray>Try again later.</gray>
        error:
          title: <red><bold>Apply Upgrade</bold></red>
        consume: <gray>Consume the upgrade book.</gray>
      quick:
        title: <green><bold>Quick Apply</bold></green>
        waiting:
          title: <dark_gray><bold>Quick Apply</bold></dark_gray>
          hint: <gray>Place a target item and upgrade.</gray>
        missing:
          title: <red><bold>Quick Apply</bold></red>
          hint: <gray>Upgrade system missing.</gray>
        error:
          title: <red><bold>Quick Apply</bold></red>
        hint: <gray>Apply and close.</gray>
