        title: <gold><bold>{name}</bold></gold>
      order:
        label: '<dark_gray>Quest order: {order}</dark_gray>'
        random: Random pool
        ordered: Ordered list
      partyLocked: <red>Party quests require random-pool givers.</red>
  systemStatus:
    title: <white><bold>System Status</bold></white>
    header:
      title: <gold><bold>Status</bold></gold>
      hint: <gray>Reload summaries + validation errors.</gray>
    overview:
      title: <gray>Overview</gray>
      subsystems: <gray>Subsystems:</gray> <white>{count}</white>
      errors: <gray>Errors:</gray> <white>{count}</white>
    entry:
      title: <yellow>{label}</yellow>
    errors:
      title: <red><bold>Error Report</bold></red>
      hint: <gray>View all validation errors.</gray>
