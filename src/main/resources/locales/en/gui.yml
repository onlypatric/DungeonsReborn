    editor:
      detail:
        title: <white><bold>Quest Editor</bold></white>
        header:
          title: <gold><bold>Quest:</bold> <white>{id}</white></gold>
          hint: <gray>Configure the quest settings.</gray>
        enabled:
          title: <yellow><bold>Enabled</bold></yellow>
          state:
            line: <gray>Status:</gray> {value}
            enabled: <green>Enabled</green>
            disabled: <red>Disabled</red>
          hint: <gray>Click to toggle.</gray>
        name:
          title: <yellow><bold>Name</bold></yellow>
          current: <gray>Current:</gray> <white>{value}</white>
          prompt: <yellow>Type quest name</yellow>
        description:
          title: <yellow><bold>Description</bold></yellow>
          lines: <gray>Lines:</gray> <white>{value}</white>
          hint: <gray>Use \n for new lines.</gray>
          prompt: <yellow>Enter description (use \n)</yellow>
        cooldown:
          title: <yellow><bold>Cooldown</bold></yellow>
          seconds: <gray>Seconds:</gray> <white>{value}</white>
          prompt: <yellow>Enter cooldown seconds</yellow>
        rotation:
          title: <yellow><bold>Rotation</bold></yellow>
          current: <gray>Current:</gray> <white>{value}</white>
          hint: <gray>Click to cycle.</gray>
        objectives:
          title: <yellow><bold>Objectives</bold></yellow>
          hint: <gray>Manage objectives.</gray>
        delete:
          title: <red><bold>Delete</bold></red>
          hint: <gray>Remove this quest.</gray>
          prompt: <red>Type <white>delete</white> to confirm</red>
          error: <red>Type delete to confirm.</red>
        summary:
          title: <gold><bold>Quest Summary</bold></gold>
          objectives: <gray>Objectives:</gray> <white>{count}</white>
          objective: <gray>- {value}</gray>
          more: <dark_gray>... +{count} more</dark_gray>
          rewards: <gray>Rewards:</gray> <white>{value}</white>
          allowlist: <gray>Allowlist:</gray> <white>{value}</white>
          allowlist:
            all: all worlds
          reward:
            xp: "{value} xp"
            tokens: "{value} tokens"
            compressed: "{value} compressed"
            pallets: "{value} pallets"
            items: "{value} items"
        audit:
          title: <gray><bold>Audit</bold></gray>
          editor: <gray>Last editor:</gray> <white>{value}</white>
          when: <gray>Last change:</gray> <white>{value}</white>
          unknown: unknown
        validation:
          nonNegative: <red>Value must be >= 0.</red>
          integer: <red>Enter a whole number.</red>
    objectives:
      title: <white><bold>Quest Objectives</bold></white>
      header:
        title: <gold><bold>Objectives</bold></gold>
        hint: <gray>Click to edit.</gray>
      refresh:
        title: <yellow><bold>Refresh</bold></yellow>
        hint: <gray>Reload objectives.</gray>
      add:
        kill: <green><bold>Add kill objective</bold></green>
        use: <green><bold>Add use item objective</bold></green>
        visit: <green><bold>Add visit region objective</bold></green>
        craft: <green><bold>Add craft objective</bold></green>
      entry:
        title: <white><bold>{type}</bold></white>
        summary: <gray>{summary}</gray>
    objective:
      edit:
        title: <white><bold>Edit Objective</bold></white>
        header:
          title: <gold><bold>Objective</bold></gold>
          index: <gray>Index:</gray> <white>{value}</white>
        type:
          title: <aqua><bold>Type</bold></aqua>
          current: <gray>Current:</gray> <white>{value}</white>
          hint: <gray>Click to cycle.</gray>
        count:
          title: <aqua><bold>Count</bold></aqua>
          current: <gray>Current:</gray> <white>{value}</white>
          prompt: <gray>Enter count</gray>
        mob:
          title: <aqua><bold>Mob Id</bold></aqua>
          current: <gray>Current:</gray> <white>{value}</white>
          prompt: <gray>Enter mob id (blank to clear)</gray>
        entity:
          title: <aqua><bold>Entity Type</bold></aqua>
          current: <gray>Current:</gray> <white>{value}</white>
          prompt: <gray>Enter entity type (blank to clear)</gray>
        itemId:
          title: <aqua><bold>Item Id</bold></aqua>
          current: <gray>Current:</gray> <white>{value}</white>
          prompt: <gray>Enter item id (blank to clear)</gray>
        material:
          title: <aqua><bold>Material</bold></aqua>
          current: <gray>Current:</gray> <white>{value}</white>
          prompt: <gray>Enter material (blank to clear)</gray>
        recipe:
          title: <aqua><bold>Recipe Id</bold></aqua>
          current: <gray>Current:</gray> <white>{value}</white>
          prompt: <gray>Enter recipe id (blank to clear)</gray>
        region:
          title: <aqua><bold>Region</bold></aqua>
          world: <gray>World:</gray> <white>{value}</white>
          xyz: <gray>XYZ:</gray> <white>{x},{y},{z}</white>
          radius: <gray>Radius:</gray> <white>{value}</white>
          format: <gray>Format:</gray> <white>world,x,y,z,radius</white>
          prompt: <gray>Enter region (world,x,y,z,radius)</gray>
        delete:
          title: <red><bold>Delete</bold></red>
          hint: <gray>Remove this objective.</gray>
    batch:
      title: <white><bold>Quest Batch Tools</bold></white>
      header:
        title: <gold><bold>Batch Tools</bold></gold>
        hint: <gray>Apply changes to all quests.</gray>
        count: <gray>Quests found:</gray> <white>{count}</white>
      nameTemplate:
        title: <aqua><bold>Name Template</bold></aqua>
        hint1: <gray>Use {id} for quest id.</gray>
        hint2: '<gray>Example:</gray> <white>Quest: {id}</white>'
        prompt: <yellow>Enter name template</yellow>
        error:
          required: <red>Template is required.</red>
          apply: <red>Failed to apply template.</red>
        success: <green>Quest names updated.</green>
      enable:
        title: <green><bold>Enable All</bold></green>
        hint: <gray>Set enabled=true for all quests.</gray>
        error: <red>Failed to enable quests.</red>
        success: <green>All quests enabled.</green>
      disable:
        title: <red><bold>Disable All</bold></red>
        hint: <gray>Set enabled=false for all quests.</gray>
        error: <red>Failed to disable quests.</red>
        success: <green>All quests disabled.</green>
      delete:
        title: <red><bold>Delete All</bold></red>
        hint: <gray>Type '{word}' to confirm.</gray>
        prompt: <red>Type {word} to delete all quests</red>
        cancel: <gray>Delete cancelled.</gray>
        error: <red>Failed to delete quests.</red>
        success: <green>All quests deleted.</green>
    description:
      line: <gray>{line}</gray>
    log:
      title: <white><bold>Quest Log</bold></white>
      header:
        title: <gold><bold>Quest Log</bold></gold>
        hint1: <gray>Click an available quest to accept it.</gray>
        hint2: <gray>Active quests track progress automatically.</gray>
      entry:
        title: <white><bold>{name}</bold></white>
      action:
        accept: <gray>Click to accept.</gray>
      badge:
        label: <gray>Badge:</gray> {badge}
        active: <green>ACTIVE</green>
        available: <aqua>AVAILABLE</aqua>
        completed: <gray>COMPLETED</gray>
        cooldown: <yellow>COOLDOWN</yellow>
        locked: <red>LOCKED</red>
      progress: <gray>Progress:</gray> <white>{bar} {percent}%</white>
    giver:
