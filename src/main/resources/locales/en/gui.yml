gui:
  common:
    none: (none)
    unnamed: (unnamed)
  controls:
    header: <gray><bold>Controls</bold></gray>
    bullet: <dark_gray>-</dark_gray>
    separator: <dark_gray> • </dark_gray>
    continuation: <dark_gray>...</dark_gray>
    blank_line: "<gray> </gray>"
  button:
    back: Back
    close: Close
  textInput:
    title: Type in chat
    tooltip: Type in chat
    anvilTitle: Enter text
    cancelWord: cancel
    error:
      minLength: <red>Must be at least {min} characters.</red>
      maxLength: <red>Must be at most {max} characters.</red>
      invalidFormat: <red>Invalid format.</red>
      integer: <red>Please enter a whole number.</red>
      integerRange: <red>Number must be between {min} and {max}.</red>
      positive: <red>Value must be greater than 0.</red>
  itemPicker:
    prompt: <gray>Click an item in your inventory to select it.</gray>
    invalid: <red>Please click a valid item.</red>
    title: Select item
  effects:
    editor:
      actionDetail:
        error:
          valueRequired: Value required.
          invalidNumber: Invalid number.
  showcase:
    settings:
      tryThis: Try this
    action: Pick an item
    status:
      picking: <yellow>Picking...</yellow>
      selected: '<gray>Selected:</gray> '
  numericInput:
    label: Value
    prompt: 'Type a number (or ''cancel''):'
    min: 'Min: {min}'
    max: 'Max: {max}'
    value: 'Value: {value}'
    clickToType: Click to type
    stepMinus: -{step}
    stepPlus: +{step}
    minus: '-'
    plus: +
  cycle:
    next: Next
    previous: Previous
  dropdown:
    selected: 'Selected: '
    open: Open
  list:
