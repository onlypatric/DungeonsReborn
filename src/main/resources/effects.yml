#
# --------------------------------------------------------------------------------------
# END TEMPLATE
# --------------------------------------------------------------------------------------
#
# Currently supported nodes (Phase 1, expanding over time):
#
# Actions:
# - sequence: { actions: [ ... ] }
# - delay: { ticks: <long>, then: <action> }
# - repeat_ticks: { delayTicks, periodTicks, times, action }
# - for_each_target: { targeter, originAt?, mode?, maxTargets?, then, otherwise? }
# - animate: { durationTicks, periodTicks, easing, followCaster?, action }
# - animate_realtime: { durationMillis, periodMillis, easing, followCaster?, action }
# - set_var: { key, value?, scope?: cast|player }
# - inc_var: { key, amount?, default?, scope?: cast|player }
# - with_var: { key, value?, scope?: cast|player, then }
# - debug_var: { key, label?, scope?: cast|player }   (requires /effects debug on)
# - when: { condition, then, otherwise? }
# - random_choice_weighted: { choices: [ { weight, action }, ... ] }
# - invoke_ability: { ability, mode?: subgraph|cast, maxDepth?: 8 }
# - message/action_bar: { text: "<minimessage>" }
# - title: { title: "<minimessage>", subtitle: "<minimessage>", fadeInTicks, stayTicks, fadeOutTicks }
# - sound: { sound: ENTITY_SNOWBALL_THROW, volume, pitch }
# - projectile: { speedPerTick, maxDistance, hitRadius, blockCollision, bounces, trail, onHit }
# - raycast_hit_entity: { maxDistance, raySize, stopOnBlock, ignoreCaster, then, otherwise? }
# - damage/heal/potion/knockback/pull: operate on the last hit entity (from projectile or raycast)
#
# Conditions (for when.condition):
# - always
# - sneaking
# - permission { permission }
# - has_item_tag { key }
# - has_target
# - chance { probability }
# - var_present { key, scope? }
# - var_equals { key, value, scope?, ignoreCase? }
# - var_gte/var_lte/var_gt/var_lt { key, value, scope? }
# - not { condition }
# - and/or { conditions: [ ... ] }
#
# Targeters (for for_each_target.targeter.type):
# - self
# - look_ray
# - sphere
# - nearest
# - cone
# - box
# - cylinder
# - capsule_ray
# - projectile_hit
#
# Targeter options:
# - ignoreCaster: true|false
# - filter: any|players|mobs
# - look_ray: { maxDistance, raySize, stopOnBlock }
# - sphere/nearest/cone/cylinder: { radius, ... }
# - cone: { angleDegrees }
# - box: { xRadius, yRadius, zRadius }
# - cylinder: { halfHeight } or { height } (height is converted to halfHeight)
# - capsule_ray: { maxDistance, radius, stopOnBlock }
#
# for_each_target options:
# - originAt: origin|last_hit|last_entity (where the targeter is evaluated from)
# - mode: each|first
# - maxTargets: 0 for unlimited
#
# Particles:
# - particles_point: { particle, count, offset, extra, at: origin|last_hit|last_entity }
# - particles_ring: { particle, radius, points, count, offset, extra, at: origin|last_hit|last_entity }
# - particles_line, particles_arc, particles_disk, particles_sphere_shell, particles_helix
# - particles_cone, particles_cylinder, particles_box, particles_polygon
# - preset_shockwave, preset_orbit, preset_swirl
# - preset_beam_chargeup
#
schemaVersion: 1
options:
  cancelRunningOnReload: false

macros: {}
