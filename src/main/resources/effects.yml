#
# DungeonsReborn - Effects YAML (Phase 1: abilities/effects only)
#
# LAST THING TO DO (Template):
# - This comment block is meant to be a “full template” reference for authoring abilities.
# - Copy/paste the parts you need, delete the rest, and iterate.
#
# Where this file lives:
# - `src/main/resources/effects.yml` is the DEFAULT TEMPLATE bundled in the jar.
# - On first run, the plugin copies it to: `plugins/DungeonsReborn/effects.yml`
# - After that, the plugin will NOT overwrite your file automatically.
# - Optional: you can split abilities into multiple files:
#   - Folder: `plugins/DungeonsReborn/effects/abilities/`
#   - Any `*.yml` / `*.yaml` file in that folder is loaded on `/effects reload`.
#   - Duplicated ability ids or macro ids across files cause reload errors.
#
# Reload after edits:
#   /effects reload
#
# Testing:
#   /effects cast <abilityId>
# Example:
#   /effects cast yaml_demo_projectile
#
# Binding to items:
# - You can bind YAML abilities directly using `triggers:` inside each ability (recommended).
# - You can also bind ad-hoc to a single item using:
#     /effects bind add right <abilityId>
#     /effects bind add left <abilityId>
# - For reusable item bindings, create item files:
#     plugins/DungeonsReborn/effects/items/<itemId>.yml
#   Each item file defines an `item:` matcher + `bindings:` list (see docs).
# - Item mana bonuses (from item files):
#     mana:
#       maxBonus: 20     # add to player max mana while held/equipped
#       regenBonus: 1.5  # mana per SECOND (scaled by regen period)
#
# Non-player casters:
# - The engine can cast abilities with non-player LivingEntity casters, but this YAML layer currently targets
#   player-facing use cases (messages/actionbars/titles + mana costs).
# - If you later trigger casts from mobs/NPCs, those player-only parts simply won’t apply.
#
# Text formatting:
# - `name` and `description` are MiniMessage strings (recommended).
# - If MiniMessage parsing fails, the plugin falls back to legacy `§` color codes.
# - Descriptions can be multiline using YAML `|` blocks.
#
# Placeholders (usable in `message`, `action_bar`, `title`, `debug_log`):
# - {player}, {ability}, {castId}, {tick}
# - {target}, {target_type}  (uses the current "last entity" context, e.g. from raycast/projectile/for_each_target)
# - {mana}, {mana_max}       (player casters only)
# - {var:key}                (looks in cast vars, then player vars)
# - {var:cast:key} / {var:player:key}
#
# Notes:
# - YAML abilities are compiled into the existing code-first engine at reload time.
# - If a YAML ability fails to compile, it will be skipped and errors will be shown on reload.
# - Ability ids (the keys under `abilities:`) are normalized to `[a-z0-9_.:-]`.
# - Every `type:` is validated; unknown types/invalid values fail fast on reload.
# - Merge policy: YAML overrides code. If a YAML ability id matches a code ability id, the YAML version replaces it.
#
# Reload options (root level):
# - options:
#     cancelRunningOnReload: false   # If true, cancels running scheduled work for previously-loaded YAML casts.
# - Optional per-ability profiling:
#   - Add `profile: true` to an ability to wrap its root action with timing measurement.
#   - Then use `/effects timings last` to inspect `yaml:<abilityId>` timings.
#
# Triggers (Phase 3):
# - Abilities can register click bindings directly from YAML:
#
#   triggers:
#     - type: interact
#       click: RIGHT_CLICK   # RIGHT_CLICK | LEFT_CLICK
#       # Optional:
#       # id: "my_binding_id"          # defaults to yaml:<abilityId>:<index>
#       # requireSneaking: false
#       # permission: "dungeonsreborn.spells.some_ability"
#       # cancelEvent: true
#       # item: (matcher, optional; defaults to any_non_air)
#       #   type: material
#       #   material: DIAMOND_SWORD
#
# Item matchers (Phase 3):
# - any_non_air: {}
# - material: { material: DIAMOND_SWORD }
# - custom_model_data: { value: 123 }   # or { cmd: 123 }
# - pdc_tag: { key: "namespace:key" }
# - lore_contains: { text: "Some substring" }
# - and/or:
#     type: and
#     matchers: [ { ... }, { ... } ]
#
# Authoring workflow (recommended):
# 1) Copy the “FULL TEMPLATE” chunks below into your own ability.
# 2) Start with a single `sequence` and one simple leaf action (sound/message/particles_ring).
# 3) Add requirements/costs/cooldown after the action looks correct.
# 4) Add targeting (raycast/projectile) last.
# 5) Iterate using:
#    - `/effects reload` (compile YAML)
#    - `/effects cast <abilityId>` (test)
#    - `/effects info <abilityId>` (view name/description)
#
# Common gotchas:
# - YAML indentation matters. If reload errors look “weird”, check indentation first.
# - If you use `:` inside a plain string, wrap it in quotes.
# - If you want multiline text, use YAML `|` blocks (see description examples below).
#
# DSL scripts (Phase 6, experimental):
# - You can replace `action:` with a `script:` block:
#     script:
#       language: "dsl-v1"
#       source: |-
#         on_cast { particles.ring particle=CRIT radius=1.4 points=24 count=1 }
# - Or reference a file under `plugins/DungeonsReborn/effects/scripts/`:
#     script:
#       language: "dsl-v1"
#       file: "my_spell.es"
#
# Troubleshooting:
# - No particles? Check your particle budget/quality:
#     /effects particles quality 1
#     /effects particles budget 25000
# - No target? Your raycast might be too short, or blocked by blocks (`stopOnBlock: true`).
# - Projectile misses? Use `blockCollision: PASS_THROUGH` or add an `otherwise:` branch with raycasts.
#
# --------------------------------------------------------------------------------------
# FULL TEMPLATE (copy what you need)
# --------------------------------------------------------------------------------------
