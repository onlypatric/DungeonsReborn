# schemaVersion: 1
#
# Optional (Phase 2): reusable action macros
# macros:
#   # A macro can be ANY action node, including delay/repeat/projectile/etc.
#   # Tip: keep macros “pure visuals” so they’re reusable across abilities.
#   #
#   my_macro_id:
#     type: sequence
#     actions:
#       - type: sound
#         sound: ENTITY_EXPERIENCE_ORB_PICKUP
#         volume: 0.6
#         pitch: 1.8
#       - type: particles_ring
#         particle: END_ROD
#         radius: 1.6
#         points: 32
#         count: 1
#
#   macro_delay_example:
#     type: delay
#     ticks: 10
#     then:
#       type: particles_ring
#       particle: END_ROD
#       radius: 1.1
#       points: 22
#       count: 1
#
# abilities:
#   some_ability_id:
#     # MiniMessage supported:
#     name: "<gold>My Ability"
#     # Multiline description supported:
#     description: |-
#       <gray>Line 1</gray>
#       <dark_gray>Line 2</dark_gray>
#
#     # Requirements (optional)
#     requirements:
#       - type: sneaking
#         message: "<red>Sneak to cast.</red>"
#       - type: permission
#         permission: "dungeonsreborn.spells.myability"
#         message: "<red>No permission.</red>"
#       - type: has_item_tag
#         key: "dungeonsreborn:debug_marker"
#         message: "<red>You need the tagged item.</red>"
#
#     # Costs (optional)
#     costs:
#       - type: mana
#         amount: 10
#       - type: consume_item
#         amount: 1
#       - type: durability
#         damage: 8
#         allowBreak: false
#
#     # Cooldown (optional)
#     cooldown:
#       ticks: 40
#       key: "my_cooldown_group" # optional
#
#     # Root action graph
#     action:
#       type: sequence
#       actions:
#         # Include a macro (Phase 2):
#         - type: include
#           macro: my_macro_id
#
#         # Or include the delay example:
#         # - type: include
#         #   macro: macro_delay_example
#
#         - type: sound
#           sound: ENTITY_BLAZE_SHOOT
#           volume: 0.7
#           pitch: 1.6
#
#         - type: message
#           text: "<green>Casted!</green>"
#
#         - type: action_bar
#           text: "<aqua>Charging...</aqua>"
#
#         - type: title
#           title: "<gold>Spell!</gold>"
#           subtitle: "<gray>subtitle</gray>"
#           fadeInTicks: 10
#           stayTicks: 40
#           fadeOutTicks: 10
#
#         # Delay / repeat
#         - type: delay
#           ticks: 10
#           then:
#             type: particles_ring
#             particle: END_ROD
#             radius: 2.0
#             points: 32
#             count: 1
#
#         - type: repeat_ticks
#           delayTicks: 0
#           periodTicks: 2
#           times: 10
#           action:
#             type: particles_line
#             particle: ELECTRIC_SPARK
#             length: 8.0
#             step: 0.35
#             count: 1
#
#         # Branching
#         - type: chance
#           probability: 0.25
#           then: { type: message, text: "<green>Lucky!</green>" }
#           otherwise: { type: message, text: "<gray>Nope.</gray>" }
#
#         # Targeting (raycast) -> sets "last entity" for the nested actions
#         - type: raycast_hit_entity
#           maxDistance: 20.0
#           raySize: 0.35
#           stopOnBlock: true
#           ignoreCaster: true
#           then:
#             type: sequence
#             actions:
#               - type: particles_ring
#                 particle: CRIT
#                 radius: 1.2
#                 points: 24
#                 count: 1
#                 at: last_entity
#               - type: damage
#                 amount: 6
#                 policy: hostile_default
#               - type: potion
#                 effect: "minecraft:poison"
#                 durationTicks: 60
#                 amplifier: 0
#               - type: knockback
#                 horizontal: 1.2
#                 vertical: 0.35
#           otherwise:
#             type: message
#             text: "<gray>No target.</gray>"
#
#         # Projectile -> sets "last entity" for onHit actions
#         - type: projectile
#           speedPerTick: 1.35
#           maxDistance: 30
#           hitRadius: 0.35
#           ignoreCaster: true
#           # STOP (default) / PASS_THROUGH / BOUNCE
#           blockCollision: STOP
#           # If blockCollision == BOUNCE:
#           # bounces: { max: 6, restitution: 0.88 }
#           trail:
#             particle: END_ROD
#             count: 1
#             offset: 0.0
#             extra: 0.0
#           onHit:
#             type: sequence
#             actions:
#               - type: particles_ring
#                 particle: CRIT
#                 radius: 1.0
#                 points: 22
#                 count: 1
#                 at: last_hit
#               - type: damage
#                 amount: 4
#                 policy: hostile_default
#
# Particles (available):
# - particles_ring: { particle, radius, points, count, offset, extra, at: origin|last_hit|last_entity }
# - particles_line: { particle, length, step, count, offset, extra }
# - particles_arc: { particle, radius, angleDegrees, points, count, offset, extra }
# - particles_disk: { particle, radius, rings, pointsPerRing, count, offset, extra }
# - particles_sphere_shell: { particle, radius, points, count, offset, extra }
# - particles_helix: { particle, radius, length, turns, points, count, offset, extra }
# - particles_cone: { particle, length, angleDegrees, rings, pointsPerRing, count, offset, extra }
# - particles_cylinder: { particle, radius, height, rings, pointsPerRing, count, offset, extra }
# - particles_box: { particle, xRadius, yRadius, zRadius, step, count, offset, extra }
# - particles_polygon: { particle, radius, sides, pointsPerEdge, count, offset, extra }
# - particles_bezier: { particle, pointsPerMeter, maxPoints, count, offset, extra, p0/p1/p2/p3 }
# - particles_spline: { particle, pointsPerMeter, maxPoints, count, offset, extra, points: [ ... ] }
#
# Bezier/spline points:
# - Each point supports two styles (they stack):
#   - local offsets: { forward, right, up }  (relative to caster look direction)
#   - absolute offsets: { x, y, z }          (world-space deltas)
#
# Presets:
# - preset_shockwave: { particle, startRadius, endRadius, durationTicks, periodTicks, easing, points, count, offset, extra }
# - preset_orbit: { particle, radius, durationTicks, periodTicks, easing, copies, count, offset, extra }
# - preset_swirl: { particle, radius, height, durationTicks, periodTicks, easing, points, count, offset, extra }
# - preset_beam_chargeup: { particle, startLength, endLength|length, durationTicks, periodTicks, easing, step, count, offset, extra }
#
# Easing values (where supported):
# - LINEAR
# - IN_OUT_CUBIC
# - OUT_QUAD
#
# Debug:
# - debug_log: { message: "..." }   (requires /effects debug on to show in server log)
#
# Full worked example (kitchen sink):
# - Copy/paste this whole ability and then delete what you don’t need.
#
# abilities:
#   yaml_template_kitchen_sink:
#     name: "<gradient:gold:yellow><bold>Kitchen Sink</bold></gradient>"
#     description: |-
#       <gray>This is a full “template” ability showing most supported nodes.</gray>
#       <dark_gray>Copy chunks, then delete the rest.</dark_gray>
#     requirements:
#       - type: sneaking
#         message: "<red>You must sneak.</red>"
#     costs:
#       - type: mana
#         amount: 10
#     cooldown:
#       ticks: 60
#     action:
#       type: sequence
#       actions:
#         - type: debug_log
#           message: "casting kitchen sink"
#         - type: sound
#           sound: minecraft:entity.blaze.shoot
#           volume: 0.7
#           pitch: 1.4
#         - type: preset_shockwave
#           particle: END_ROD
#           startRadius: 0.8
#           endRadius: 4.0
#           durationTicks: 20
#           periodTicks: 1
#           easing: OUT_QUAD
#           points: 42
#           count: 1
#
#         # “Charge up” beam (grows out from the player’s eyes along look direction)
#         - type: preset_beam_chargeup
#           particle: ELECTRIC_SPARK
#           startLength: 0.0
#           endLength: 10.0
#           durationTicks: 20
#           periodTicks: 1
#           easing: IN_OUT_CUBIC
#           step: 0.35
#           count: 1
#           offset: 0.0
#           extra: 0.0
#         - type: raycast_hit_entity
#           maxDistance: 20.0
#           raySize: 0.35
