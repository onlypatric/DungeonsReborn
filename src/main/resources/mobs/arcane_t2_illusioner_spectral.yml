schemaVersion: 1
mobs:
  arcane_t2_illusioner_spectral:
    type: ILLUSIONER
    name: <light_purple>Spectral</light_purple>
    showName: true
    stats:
      maxHealth: 40
    ai:
      enabled: true
      aggroTargetMode: NEAREST_PLAYER
      aggroRadius: 24
      leashRadius: 30
      idleWanderRadius: 5
      idleWanderIntervalTicks: 80
    passives:
    - periodTicks: 50
      script:
        language: dsl-v1
        source: "on_cast {\n  particles.ring particle=END_ROD radius=2.4 points=20\
          \ count=1\n  particles.ring particle=PORTAL radius=2.7 points=24 count=1\n\
          \  particles.point particle=ENCHANT count=6\n}"
    attacks:
      main:
        trigger: RANGED
        cooldownTicks: 18
        chance: 1.0
        range: 14
        requireLineOfSight: false
        script:
          language: dsl-v1
          source: "on_cast {\n  for_each_target type=nearest radius=4 filter=players\
            \ originAt=origin {\n    potion effect=SLOWNESS durationTicks=120 amplifier=0\n\
            \    potion effect=WEAKNESS durationTicks=90 amplifier=0\n    potion effect=GLOWING\
            \ durationTicks=90 amplifier=0\n  }\n}"
    xpGating:
      minLevel: 15000
    progression:
      minXp: 50
      maxXp: 75
      maxPlayerXp: 2000000
    loot:
      pool: elemental_arcane
      merge: true
spawnerBlocks:
  arcane_t2_illusioner_spectral_spawner:
    mob: arcane_t2_illusioner_spectral
    material: SPAWNER
    spawn:
      count: 1
      maxAlive: 4
      respawnTicks: 140
      respawnJitterTicks: 20
      radius: 10
      activationRadius: 28
      attackRadius: 22
      allowBlockDamage: false
      tether:
        radius: 16
        action: TELEPORT
      hologram:
        enabled: true
        offsetY: 2.3
        format: <light_purple>{mob}</light_purple> <gray>({alive}/{cap})</gray>
