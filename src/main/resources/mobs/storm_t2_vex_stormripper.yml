schemaVersion: 1
mobs:
  storm_t2_vex_stormripper:
    type: VEX
    name: <aqua>Stormripper</aqua>
    showName: true
    stats:
      maxHealth: 100
    ai:
      enabled: true
      aggroTargetMode: NEAREST_PLAYER
      aggroRadius: 24
      leashRadius: 30
      idleWanderRadius: 5
      idleWanderIntervalTicks: 80
    passives:
    - periodTicks: 50
      script:
        language: dsl-v1
        source: "on_cast {\n  particles.ring particle=EXPLOSION radius=2.2 points=10\
          \ count=1\n  particles.ring particle=DRIPPING_WATER radius=2.6 points=18\
          \ count=1\n  particles.point particle=ELECTRIC_SPARK count=6\n}"
    attacks:
      main:
        trigger: RANGED
        cooldownTicks: 18
        chance: 1.0
        range: 14
        requireLineOfSight: false
        script:
          language: dsl-v1
          source: "on_cast {\n  for_each_target type=nearest radius=4 filter=players\
            \ originAt=origin {\n    potion effect=SLOWNESS durationTicks=120 amplifier=0\n\
            \    potion effect=WEAKNESS durationTicks=90 amplifier=0\n    knockback\
            \ horizontal=0.7 vertical=0.12\n  }\n}"
    phases:
    - id: storm
      healthBelow: 0.5
      attacks:
        main:
          trigger: RANGED
          cooldownTicks: 14
          chance: 1.0
          script:
            language: dsl-v1
            source: "on_cast {\n  for_each_target type=nearest radius=4 filter=players\
              \ originAt=origin {\n    potion effect=SLOWNESS durationTicks=160 amplifier=1\n\
              \    potion effect=WEAKNESS durationTicks=120 amplifier=0\n    pull\
              \ horizontal=0.6 vertical=0.08\n  }\n}"
      passives:
      - periodTicks: 40
        script:
          language: dsl-v1
          source: "on_cast {\n  particles.ring particle=EXPLOSION radius=2.8 points=14\
            \ count=2\n  particles.ring particle=DRIPPING_WATER radius=3.0 points=22\
            \ count=1\n  particles.point particle=ELECTRIC_SPARK count=10\n}"
    xpGating:
      minLevel: 15000
    progression:
      minXp: 45
      maxXp: 65
      maxPlayerXp: 2000000
    loot:
      pool: elemental_storm
      merge: true
spawnerBlocks:
  storm_t2_vex_stormripper_spawner:
    mob: storm_t2_vex_stormripper
    material: SPAWNER
    spawn:
      count: 1
      maxAlive: 4
      respawnTicks: 140
      respawnJitterTicks: 20
      radius: 10
      activationRadius: 28
      attackRadius: 22
      allowBlockDamage: false
      tether:
        radius: 16
        action: TELEPORT
      hologram:
        enabled: true
        offsetY: 2.3
        format: <aqua>{mob}</aqua> <gray>({alive}/{cap})</gray>
