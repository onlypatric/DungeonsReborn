# DungeonsReborn kits.yml
#
# Kits are item bundles players can claim via /dr kits.
# - Starter kits are one-time by default.
# - Future daily kits can set cooldownSeconds and oneTime=false.

kits:
  starter:
    title: "Starter Kit"
    permission: dungeonsreborn.kits.starter
    oneTime: true
    cooldownSeconds: 0
    items:
      - type: material
        material: BREAD
        amount: 16
      - type: material
        material: COOKED_BEEF
        amount: 8
      - type: material
        material: TORCH
        amount: 32
      - type: material
        material: IRON_INGOT
        amount: 12
      - type: itemId
        itemId: mythic-sword
        amount: 1
